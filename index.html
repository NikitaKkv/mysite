<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mysite</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1f1a;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Размытый фон из той же картинки для красивого заполнения полей на любых экранах */
    .bg-blur {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('Pasted%20image.png');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      filter: blur(30px) brightness(0.4);
      transform: scale(1.1);
      z-index: 1;
    }
    /* Сама картинка по центру во весь экран без обрезки */
    .main-img {
      position: relative;
      z-index: 2;
      max-width: 100vw;
      max-height: 100vh;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <div class="bg-blur"></div>
  <img class="main-img" src="Pasted%20image.png" alt="mysite image">
</body>
</html>
